<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Events — Peninsula Cyber Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/images/logo.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body class="admin-body">
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <a class="brand" href="/admin/dashboard.html">
        <img src="/images/logo.svg" alt="" width="32" height="32" />
        <span class="brand-name">Peninsula Cyber</span>
      </a>
      <nav aria-label="Admin">
        <a href="/admin/dashboard.html">Dashboard</a>
        <a href="/admin/events.html" class="active">Events</a>
        <a href="/admin/subscribers.html">Mailing List</a>
      </nav>
    </aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <h1>Events</h1>
        <div class="action-row">
          <button class="btn btn-primary btn-sm" id="add-event-btn">Add Event</button>
          <button class="btn btn-secondary btn-sm" data-logout>Log out</button>
        </div>
      </div>

      <div class="admin-table-wrapper">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Title</th>
              <th>Location</th>
              <th>Registration</th>
              <th>RSVPs</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="events-table-body">
            <tr><td colspan="6">Loading events…</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="event-modal" hidden>
    <div class="modal-card">
      <h2 id="event-modal-title">Add Event</h2>
      <form id="event-form" novalidate>
        <input type="hidden" id="event-id" />
        <div class="form-field">
          <label for="event-title">Title</label>
          <input type="text" id="event-title" required />
        </div>
        <div class="form-field">
          <label for="event-date">Date</label>
          <input type="date" id="event-date" required />
        </div>
        <div class="form-field">
          <label for="event-time">Time</label>
          <input type="text" id="event-time" placeholder="e.g. 10:00 AM - 11:30 AM" />
        </div>
        <div class="form-field">
          <label for="event-location">Location</label>
          <input type="text" id="event-location" placeholder="e.g. Poulsbo Library" />
        </div>
        <div class="form-field">
          <label for="event-description">Description</label>
          <textarea id="event-description" rows="4"></textarea>
        </div>
        <div class="form-field">
          <label for="event-registration">Registration URL (optional)</label>
          <input type="url" id="event-registration" placeholder="https://" />
        </div>
        <div class="form-field">
          <label for="event-capacity">Capacity (optional)</label>
          <input type="number" id="event-capacity" min="1" />
        </div>
        <p id="event-form-error" class="form-error" role="alert"></p>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save Event</button>
          <button type="button" class="btn btn-secondary" id="cancel-event-btn">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="rsvp-list-modal" hidden>
    <div class="modal-card">
      <h2 id="rsvp-list-title">RSVPs</h2>
      <p id="rsvp-list-empty" class="form-helper" hidden>No one has RSVP'd to this event yet.</p>
      <div class="admin-table-wrapper">
        <table class="admin-table" id="rsvp-list-table" hidden>
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>RSVP'd</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="rsvp-list-body"></tbody>
        </table>
      </div>
      <div class="form-actions">
        <a class="btn btn-secondary btn-sm" id="rsvp-export-link" href="#">Export CSV</a>
        <button type="button" class="btn btn-secondary" id="rsvp-list-close-btn">Close</button>
      </div>
    </div>
  </div>

  <script src="/admin/js/admin-common.js"></script>
  <script src="/admin/js/events-admin.js"></script>
</body>
</html>
